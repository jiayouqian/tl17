<style>html,body{margin:0;background:#120e08;min-height:100vh}#boot{color:#c9a961;text-align:center;padding:60px 20px;font-family:system-ui,sans-serif;font-size:14px;letter-spacing:2px}</style>

<body>
<div id="boot">魔幻天龙 · 加载中…</div>
<script src="index_d1.js"></script>
<script src="index_d2.js"></script>
<script src="index_d3.js"></script>
<script>
function fail(e){document.getElementById('boot').innerHTML='页面加载失败，请刷新重试';console.error('数据加载失败',e)}
try{
  if(typeof B64A==='undefined'||typeof B64B==='undefined'||typeof B64C==='undefined'){throw new Error('missing segment')}
  var bin=atob(B64A+B64B+B64C);
  var ds=new DecompressionStream('gzip');
  var st=new Blob([bin]).stream().pipeThrough(ds).getReader();
  var chunks=[],len=0;
  (function read(){
    st.read().then(function(r){
      if(r.done){
        var u8=new Uint8Array(len),off=0;
        chunks.forEach(function(c){u8.set(c,off);off+=c.length});
        document.open();document.write(new TextDecoder().decode(u8));document.close();
      }else{chunks.push(r.value);len+=r.value.length;read()}
    }).catch(fail)
  })()
}catch(e){fail(e)}
</script>
</body>
</html>
