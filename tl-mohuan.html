<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data: blob: https:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>天龙魔幻版 · 17职业国际服</title>
<style>html,body{margin:0;background:#120e08;min-height:100vh}#ld{color:#c9a961;text-align:center;padding:60px 20px;font-family:system-ui,sans-serif;font-size:14px;letter-spacing:2px}</style>
</head>
<body>
<div id="ld">天龙魔幻版 · 加载中…</div>
<script>
(function(){
  /* 三段并行下载(不阻塞首屏渲染)，拿到后按 B64A/B64B/B64C 顺序拼接解码 */
  var v = 'v20261005005500';
  var files = ['index_d1.js?v=' + v, 'index_d2.js?v=' + v, 'index_d3.js?v=' + v];
  function fail(e){
    var el = document.getElementById('ld');
    if (el) el.textContent = '加载失败，请刷新重试';
    console.error(e);
  }
  Promise.all(files.map(function (f) {
    return fetch(f, { cache: 'no-store' }).then(function (r) { return r.text(); }).catch(function () { return ''; });
  })).then(function (ts) {
    var parts = [];
    ts.forEach(function (t) {
      var m = t.match(/var\s+B64[ABC]="([^"]*)"/);
      parts.push(m ? m[1] : '');
    });
    var B64 = parts.join('');
    if (B64.length < 100) { fail('数据加载失败'); return; }
    var bin = atob(B64);
    var u8 = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) { u8[i] = bin.charCodeAt(i); }
    var ds = new DecompressionStream('gzip');
    var stream = new Blob([u8]).stream().pipeThrough(ds);
    new Response(stream).text().then(function (txt) {
      document.open();
      document.write(txt);
      document.close();
    }).catch(fail);
  }).catch(fail);
})();
</script>
<script>
(function(){
  /* 首载盖章：把当前版本写入 URL ?ver= 一次（replace，不入栈）。
     真实页据此得到 curVer，首访不触发自刷白屏；后续秒更新一律由真实页 URL ver 比较法负责，
     壳层不再做轮询，避免与真实页双重检测、也避免发版忘改 __ver 时每 3 秒死循环 reload。 */
  var __ver='v20261005005500';
  if(!location.search.match(/[?&]ver=/)){
    try{ history.replaceState(null,'', location.pathname + '?ver=' + __ver); }catch(e){}
  }
})();
</script>

</body>
</html>
