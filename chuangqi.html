<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传奇专区 · 游戏模板</title>
<style>
  body{margin:0;background:#0d0a06;color:#f2e7cf;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh}
  .ld{text-align:center;font-size:15px;color:#a8915f}
  .ld .bar{width:180px;height:4px;background:#33271a;border-radius:2px;margin:14px auto 0;overflow:hidden}
  .ld .bar i{display:block;height:100%;width:40%;background:#d4a94a;border-radius:2px;animation:ld 1.2s infinite ease-in-out}
  @keyframes ld{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
</style>
</head>
<body>
<div class="ld" id="ld">传奇专区加载中…<div class="bar"><i></i></div></div>
<script src="chuangqi_d1.js"></script>
<script src="chuangqi_d2.js"></script>
<script>
(function(){
  if(typeof B64A === 'undefined' || typeof B64B === 'undefined'){ fail('数据加载失败'); return; }
  var B64 = B64A + B64B;
  try{
    var bin = atob(B64);
    var u8 = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){ u8[i]=bin.charCodeAt(i); }
    var ds = new DecompressionStream('gzip');
    var stream = new Blob([u8]).stream().pipeThrough(ds);
    new Response(stream).text().then(function(txt){
      document.open();
      document.write(txt);
      document.close();
    }).catch(fail);
  }catch(e){ fail(e); }
  function fail(e){
    document.getElementById('ld').textContent='加载失败，请刷新重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
