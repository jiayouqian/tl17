<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>传奇专区 · 游戏模板</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%230d0a06'/%3E%3Cpath d='M12 4l1.8 4.2L18 9l-4.2 1.8L12 15l-1.8-4.2L6 9l4.2-.8z' fill='%23d4a94a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --bg:#0d0a06; --panel:#171209; --panel2:#1e1710; --line:#33271a;
    --gold:#d4a94a; --gold-2:#e8c878; --gold-dim:#a8915f;
    --red:#b3382b; --red-2:#d34b3a;
    --tx:#f2e7cf; --tx-dim:#b6a584; --tx-mute:#8a7a5e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg); color:var(--tx);
    font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    line-height:1.7; -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Noto Serif SC",serif}

  /* ===== 顶部导航 ===== */
  header{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px; background:rgba(13,10,6,.92); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
  }
  .logo{display:flex;align-items:center;gap:10px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:19px;color:var(--gold)}
  .logo svg{width:26px;height:26px}
  .nav{display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .nav a{
    padding:6px 18px;border-radius:999px;color:var(--tx-dim);
    text-decoration:none;font-size:15px;font-weight:500;transition:.2s;
  }
  .nav a.on{background:var(--gold);color:#191209;font-weight:700}
  .nav a:not(.on):hover{color:var(--tx)}

  /* ===== 视图容器 ===== */
  .view{display:none;max-width:1080px;margin:0 auto;padding:26px 20px 60px}
  .view.on{display:block}
  .view-title{
    font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--gold-2);
    text-align:center;margin:14px 0 4px;
  }
  .view-sub{text-align:center;color:var(--tx-mute);font-size:14px;margin-bottom:26px}

  /* ===== 传奇专区通栏 / 分类 ===== */
  .zone-hero{
    background:radial-gradient(900px 260px at 50% -20%,#2a2012,#0d0a06 72%);
    border:1px solid var(--line);border-radius:14px;text-align:center;padding:20px 16px 16px;margin-bottom:14px;
  }
  .zone-hero h2{font-size:24px;font-weight:900;color:var(--gold-2);margin-bottom:6px}
  .zone-hero p{color:var(--tx-dim);font-size:13px;margin-bottom:8px}
  .zone-count{display:inline-block;font-size:11px;color:var(--tx-mute);border:1px solid var(--line);padding:2px 12px;border-radius:999px}
  .filterbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .cat-tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
  .cat-tabs .tab{
    padding:6px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);
    color:var(--tx-dim);font-size:13px;cursor:pointer;transition:.18s;
  }
  .cat-tabs .tab:hover{color:var(--tx);border-color:var(--gold-dim)}
  .cat-tabs .tab.on{background:var(--gold);color:#191209;font-weight:700;border-color:var(--gold)}
  /* 折叠菜单（二级分类） */
  .cat-fold{position:relative;flex:1;min-width:0}
  .cat-fold-btn{
    display:flex;align-items:center;gap:8px;width:100%;padding:7px 12px;
    background:var(--panel);border:1px solid var(--line);border-radius:999px;
    color:var(--tx);font-size:13px;cursor:pointer;transition:border-color .18s;
  }
  .cat-fold-btn:hover{border-color:var(--gold-dim)}
  .cat-fold-btn .cf-label{font-size:11px;color:var(--tx-mute);border:1px solid var(--line);border-radius:999px;padding:1px 8px;flex:none;white-space:nowrap}
  .cat-fold-btn .cf-cur{flex:1;min-width:0;text-align:left;color:var(--gold);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cat-fold-btn .cf-arrow{flex:none;color:var(--tx-mute);transition:transform .2s}
  .cat-fold.open .cf-arrow{transform:rotate(180deg)}
  .cat-fold-panel{
    display:none;position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:40;
    background:#161009;border:1px solid var(--line);border-radius:12px;padding:8px;
    box-shadow:0 14px 34px rgba(0,0,0,.55);
  }
  .cat-fold-panel.open{display:block}
  .cat-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
    padding:8px 12px;border-radius:8px;background:transparent;border:none;
    color:var(--tx-dim);font-size:13px;cursor:pointer;text-align:left;transition:.15s;
  }
  .cat-item:hover{background:var(--panel2);color:var(--tx)}
  .cat-item.on{background:var(--gold);color:#191209;font-weight:700}
  .cat-item em{font-style:normal;font-size:11px;color:var(--tx-mute)}
  .cat-item.on em{color:#191209}
  .cat-fold-panel::-webkit-scrollbar{width:6px}
  .cat-fold-panel::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}
  .search{
    background:var(--panel);border:1px solid var(--line);border-radius:999px;color:var(--tx);
    padding:7px 14px;font-size:13px;width:180px;outline:none;
  }
  .search:focus{border-color:var(--gold-dim)}
  @media(max-width:640px){.search{width:100%}}
  .cat-head{display:flex;align-items:baseline;gap:10px;margin:6px 2px 14px}
  .cat-head span{font-family:"Noto Serif SC",serif;font-size:19px;font-weight:700;color:var(--gold)}
  .cat-head em{font-style:normal;font-size:12px;color:var(--tx-mute)}

  /* ===== 传奇列表：紧凑行 ===== */
  .row-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:700px){.row-grid{grid-template-columns:1fr}}
  .row-card{
    display:flex;align-items:center;gap:10px;padding:8px 10px;min-width:0;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    text-decoration:none;color:var(--tx);transition:border-color .15s,background .15s;
  }
  .row-card:hover{border-color:var(--gold);background:var(--panel2)}
  .row-thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line);background:#000}
  .row-ph{
    width:46px;height:46px;border-radius:8px;flex:none;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2a2012,#0d0a06 70%);border:1px solid var(--line);
    font-size:10px;color:var(--tx-mute);
  }
  .row-info{flex:1;min-width:0}
  .row-info h3{font-size:14px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-info p{font-size:12px;color:var(--tx-mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row-card .badge{flex:none;font-size:10px;padding:2px 6px}
  .row-arrow{flex:none;color:var(--tx-mute);display:flex}
  .badge{font-size:11px;color:#191209;background:var(--gold);padding:2px 8px;border-radius:4px;font-weight:600}
  .badge.red{background:var(--red-2);color:#fff}

  /* ===== 详情页 ===== */
  .back{
    display:inline-flex;align-items:center;gap:6px;color:var(--tx-dim);text-decoration:none;
    font-size:14px;margin-bottom:18px;
  }
  .back:hover{color:var(--gold)}
  .detail-hero{
    display:grid;grid-template-columns:1.3fr 1fr;gap:22px;align-items:stretch;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;
  }
  @media(max-width:760px){.detail-hero{grid-template-columns:1fr}}
  .detail-poster-ph{
    aspect-ratio:3/4;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#2a2012,#0d0a06 70%);border:1px solid var(--line);border-radius:10px;
    color:var(--tx-mute);font-size:14px;overflow:hidden;
  }
  .poster-img{width:100%;height:100%;object-fit:cover;display:block}
  .detail-info h2{font-family:"Noto Serif SC",serif;font-size:26px;font-weight:900;color:var(--gold-2)}
  .detail-info .slogan{color:var(--tx-dim);margin:6px 0 14px;font-size:15px}
  .detail-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    flex:1;min-width:120px;text-align:center;padding:12px 0;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;border:none;
  }
  .btn.register{background:var(--red);color:#fff}
  .btn.register:hover{background:var(--red-2)}
  .btn.recharge{background:var(--gold);color:#191209}
  .btn.recharge:hover{background:var(--gold-2)}
  .btn.ghost{background:transparent;color:var(--tx-dim);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--tx);border-color:var(--gold-dim)}
  .agentcode{margin-top:12px;font-size:13px;color:var(--tx-mute)}
  .agentcode b{color:var(--gold)}

  .sec{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px}
  .sec h4{font-family:"Noto Serif SC",serif;font-size:17px;font-weight:700;color:var(--gold-2);margin-bottom:12px}
  .sec ul{list-style:none}
  .sec li{padding:9px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;align-items:baseline;font-size:14px;color:var(--tx-dim)}
  .sec li:last-child{border-bottom:none}
  .sec li::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--gold);align-self:center}
  .guide p{font-size:14px;color:var(--tx-dim);margin-bottom:8px}

  /* ===== 礼包码分区 ===== */
  .codes{display:flex;flex-direction:column;gap:10px}
  .code-chip{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;
  }
  .code-name{
    font-family:"Noto Serif SC",serif;font-weight:900;font-size:16px;color:#191209;
    background:var(--gold);padding:4px 12px;border-radius:6px;letter-spacing:1px;flex:none;
  }
  .code-items{font-size:14px;color:var(--tx-dim)}

  /* ===== 图片画廊（分区图） ===== */
  .gallery{column-count:2;column-gap:14px;margin-top:14px}
  @media(max-width:640px){.gallery{column-count:1}}
  .gallery img{
    width:100%;border-radius:10px;border:1px solid var(--line);
    margin-bottom:14px;break-inside:avoid;display:block;background:#000;
  }

  /* ===== 详情页折叠分区 ===== */
  .sec-coll{
    margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    overflow:hidden;transition:border-color .15s;
  }
  .sec-coll:hover{border-color:var(--gold-dim)}
  .sec-coll .sec-head{
    display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;
    background:transparent;border:none;color:var(--gold-2);cursor:pointer;text-align:left;
    font-family:"Noto Serif SC",serif;font-size:16px;font-weight:700;transition:background .15s;
  }
  .sec-coll .sec-head:hover{background:var(--panel2)}
  .sec-coll .sec-head .sh-arrow{margin-left:auto;color:var(--tx-mute);flex:none;transition:transform .2s}
  .sec-coll.open .sec-head .sh-arrow{transform:rotate(180deg)}
  .sec-coll .sec-body{display:none;padding:2px 16px 14px;color:var(--tx-dim);font-size:13px}
  .sec-coll.open .sec-body{display:block;animation:secIn .18s ease}
  @keyframes secIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .sec-coll .sec-body ul{list-style:none;margin:0;padding:0}
  .sec-coll .sec-body li{
    padding:9px 0;border-bottom:1px dashed var(--line);display:flex;gap:10px;
    align-items:baseline;font-size:14px;color:var(--tx-dim);line-height:1.55;
  }
  .sec-coll .sec-body li:last-child{border-bottom:none}
  .sec-coll .sec-body li::before{
    content:"";flex:none;width:6px;height:6px;border-radius:50%;
    background:var(--gold);align-self:center;
  }

  footer{text-align:center;color:var(--tx-mute);font-size:12px;padding:20px;border-top:1px solid var(--line)}

  /* ===== Toast ===== */
  #toast{
    position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--gold-dim);color:var(--tx);
    padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:100;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

var gridEl = document.getElementById('gameGrid');
var viewList = document.getElementById('view-list');
var viewDetail = document.getElementById('view-detail');
var toastEl = document.getElementById('toast');
var toastTimer = null;

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 2200);
}

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var filterCat = '全部';
var searchEl = null;

function cardHTML(g){
  var ph = g.thumb
    ? '<img class="row-thumb" src="' + g.thumb + '" alt="' + esc(g.name) + '">'
    : '<div class="row-ph">游戏图</div>';
  return '<a class="row-card" href="#/game/' + encodeURIComponent(g.id) + '">' +
      ph +
      '<div class="row-info">' +
        '<h3>' + esc(g.name) + '</h3>' +
        '<p>' + esc(g.slogan) + '</p>' +
      '</div>' +
      '<span class="badge' + (g.badgeWarn?' red':'') + '">' + esc(g.badge) + '</span>' +
      '<span class="row-arrow"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></span>' +
    '</a>';
}

function emptyHTML(){
  return '<p style="color:var(--tx-mute);text-align:center;padding:46px 0">没有找到匹配的传奇，换个分类或关键词试试</p>';
}

function renderCatFold(){
  var btn = document.getElementById('catFoldBtn');
  var panel = document.getElementById('catFoldPanel');
  var arrow = '<svg class="cf-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg>';
  btn.innerHTML = '<span class="cf-label">分类</span><span class="cf-cur">' + esc(filterCat) + '</span>' + arrow;
  var items = ['<button class="cat-item' + (filterCat==='全部'?' on':'') + '" data-cat="全部">全部游戏<em>' + GAMES.length + '</em></button>'];
  CATEGORIES.forEach(function(c){
    var n = GAMES.filter(function(g){ return g.category === c; }).length;
    items.push('<button class="cat-item' + (filterCat===c?' on':'') + '" data-cat="' + esc(c) + '">' + esc(c) + '<em>' + n + '</em></button>');
  });
  panel.innerHTML = items.join('');
  panel.querySelectorAll('.cat-item').forEach(function(b){
    b.addEventListener('click', function(){
      filterCat = this.dataset.cat;
      foldOpen = false;
      document.getElementById('catFold').classList.remove('open');
      btn.setAttribute('aria-expanded','false');
      renderCatFold();
      renderList();
    });
  });
}

var foldOpen = false;
document.getElementById('catFoldBtn').addEventListener('click', function(){
  foldOpen = !foldOpen;
  document.getElementById('catFold').classList.toggle('open', foldOpen);
  this.setAttribute('aria-expanded', foldOpen ? 'true' : 'false');
});
document.addEventListener('click', function(e){
  if(!e.target.closest('.cat-fold') && foldOpen){
    foldOpen = false;
    document.getElementById('catFold').classList.remove('open');
    document.getElementById('catFoldBtn').setAttribute('aria-expanded','false');
  }
});
// 详情页折叠分区：点击标题展开/收起
document.addEventListener('click', function(e){
  var head = e.target.closest('.sec-head');
  if(!head) return;
  var coll = head.closest('.sec-coll');
  var open = coll.classList.toggle('open');
  head.setAttribute('aria-expanded', open ? 'true' : 'false');
});

function renderList(){
  if(!searchEl){ searchEl = document.getElementById('search'); searchEl.addEventListener('input', renderList); }
  var kw = (searchEl.value || '').trim().toLowerCase();
  var grid = document.getElementById('gameGrid');
  document.getElementById('zoneCount').textContent = '共 ' + GAMES.length + ' 款 · 分类筛选 / 搜索定位';

  if(filterCat === '全部' && !kw){
    // 全部：按分类分组展示
    var html = '';
    CATEGORIES.forEach(function(cat){
      var games = GAMES.filter(function(g){ return g.category === cat; });
      if(!games.length) return;
      html += '<div class="cat-head"><span>' + esc(cat) + '</span>' +
              '<em>' + games.length + ' 款</em></div>' +
              '<div class="row-grid">' + games.map(cardHTML).join('') + '</div>';
    });
    grid.innerHTML = html || emptyHTML();
  } else {
    // 筛选 / 搜索：平铺
    var list = GAMES.filter(function(g){
      var catOk = (filterCat === '全部' || g.category === filterCat);
      var kwOk = !kw || g.name.toLowerCase().indexOf(kw) > -1;
      return catOk && kwOk;
    });
    if(!list.length){ grid.innerHTML = emptyHTML(); }
    else { grid.innerHTML = '<div class="row-grid">' + list.map(cardHTML).join('') + '</div>'; }
  }
}

function renderDetail(id){
  var g = null;
  GAMES.forEach(function(x){ if(x.id === id) g = x; });
  if(!g){
    viewList.classList.add('on');
    viewDetail.classList.remove('on');
    return;
  }
  document.getElementById('dName').textContent = g.name;
  document.getElementById('dSlogan').textContent = g.slogan;
  document.getElementById('dBadges').innerHTML = '<span class="badge">' + esc(g.badge) + '</span>';
  document.getElementById('dRegister').dataset.url = g.regLink || '#';
  document.getElementById('dAgent').innerHTML = '进服注册：' + g.agentCode;
  document.getElementById('dPoster').innerHTML = g.hero
    ? '<img class="poster-img" src="' + g.hero + '" alt="' + esc(g.name) + '">'
    : '【宣传海报位】';

  var html = '';
  function secColl(title, body){
    return '<div class="sec-coll"><button class="sec-head" type="button" aria-expanded="false">' + esc(title) +
      '<svg class="sh-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 9l6 6 6-6"/></svg></button>' +
      '<div class="sec-body">' + body + '</div></div>';
  }
  // 分区：礼包码
  if(g.codes && g.codes.length){
    var codesBody = '<div class="codes">';
    g.codes.forEach(function(c){
      codesBody += '<div class="code-chip"><span class="code-name">' + esc(c.code) + '</span>' +
              '<span class="code-items">' + c.items.map(esc).join(' · ') + '</span></div>';
    });
    codesBody += '</div>';
    html += secColl('进服礼包码', codesBody);
  }
  // 分区：上线福利
  if(g.benefits && g.benefits.length){
    html += secColl('上线福利 / 活动说明',
      '<ul>' + g.benefits.map(function(b){ return '<li>' + esc(b) + '</li>'; }).join('') + '</ul>');
  }
  // 分区：攻略正文（含图片画廊）
  (g.sections || []).forEach(function(s){
    var body = '<ul>' + s.items.map(function(i){ return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>';
    if(s.imgs && s.imgs.length){
      body += '<div class="gallery">';
      s.imgs.forEach(function(u){
        body += '<img src="' + u + '" alt="' + esc(s.title) + '" loading="lazy">';
      });
      body += '</div>';
    }
    html += secColl(s.title, body);
  });
  document.getElementById('dBody').innerHTML = html;
}

function router(){
  var hash = location.hash || '#/list';
  var m = hash.match(/^#\/game\/(.+)$/);
  if(m){
    viewList.classList.remove('on');
    viewDetail.classList.add('on');
    renderDetail(decodeURIComponent(m[1]));
    window.scrollTo(0,0);
  } else {
    viewDetail.classList.remove('on');
    viewList.classList.add('on');
    document.querySelector('.nav a[data-tab="list"]').classList.add('on');
    renderCatFold();
    renderList();
  }
}

document.querySelector('.nav a[data-tab="list"]').addEventListener('click', function(){
  document.querySelectorAll('.nav a').forEach(function(a){ a.classList.remove('on'); });
  this.classList.add('on');
});

// 下载按钮：真实链接到位后由 data-url 直跳；当前给占位提示
document.getElementById('dRegister').addEventListener('click', function(){
  var url = this.dataset.url;
  if(url && url !== '#'){ window.open(url, '_blank'); }
  else { toast('占位按钮：真实链接待填充，填好后自动跳转'); }
});

window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
