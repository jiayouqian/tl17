<script>
(function(){
    var track = document.getElementById('carouselTrack');
    var dots = document.querySelectorAll('.c-dot');
    var pageEl = document.getElementById('curPage');
    var total = dots.length;
    if (!track || total <= 1) return;
    var curIdx = 0;
    var timer = null;

    function goto(i) {
        if (i < 0) i = total - 1;
        if (i >= total) i = 0;
        curIdx = i;
        track.scrollLeft = track.clientWidth * curIdx;
        dots.forEach(function(d, j){ d.classList.toggle('active', j === curIdx); });
        if (pageEl) pageEl.textContent = curIdx + 1;
    }
    function next() { goto(curIdx + 1); }
    function start() { stop(); timer = setInterval(next, 3500); }
    function stop() { if (timer) { clearInterval(timer); timer = null; } }

    var scrollTimer = null;
    track.addEventListener('scroll', function(){
        clearTimeout(scrollTimer);
        scrollTimer = setTimeout(function(){
            var ni = Math.round(track.scrollLeft / track.clientWidth);
            if (ni !== curIdx && ni >= 0 && ni < total) {
                curIdx = ni;
                dots.forEach(function(d, j){ d.classList.toggle('active', j === curIdx); });
                if (pageEl) pageEl.textContent = curIdx + 1;
            }
        }, 100);
    });
    track.addEventListener('touchstart', stop, {passive:true});
    track.addEventListener('touchend', start, {passive:true});
    document.addEventListener('visibilitychange', function(){
        document.hidden ? stop() : start();
    });
    window.addEventListener('load', start);
})();

// 微信内置浏览器：点击下载时弹出提示，引导用浏览器打开
(function(){
    if (!/micromessenger/i.test(navigator.userAgent)) return;
    var mask = document.getElementById('wxTipsMask');
    if (!mask) return;
    document.addEventListener('click', function(e){
        var t = e.target;
        var hit = (t && t.closest) ? t.closest('.d-btn') : null;
        if (!hit) return;
        e.preventDefault();
        e.stopPropagation();
        mask.classList.add('show');
    }, true);
    mask.addEventListener('click', function(){ mask.classList.remove('show'); });
})();

// 点击轮播图片放大预览
(function(){
    var viewer = document.getElementById('imgViewer');
    if (!viewer) return;
    var viewerImg = viewer.querySelector('img');
    document.querySelectorAll('.carousel-slide img').forEach(function(img){
        img.addEventListener('click', function(){
            var src = img.getAttribute('src');
            if (!src) return;
            viewerImg.src = src;
            viewer.classList.add('show');
        });
    });
    function closeViewer() {
        viewer.classList.remove('show');
        viewerImg.removeAttribute('src');
    }
    viewer.addEventListener('click', closeViewer);
    document.addEventListener('keydown', function(e){
        if (e.key === 'Escape' && viewer.classList.contains('show')) closeViewer();
    });
})();

/**
 * 上报一次下载点击（用于渠道端「下载统计」）
 *
 * 安卓按钮是 apk 直链，点完页面马上开始跳转，普通 XHR 会被浏览器中断 →
 * 优先用 sendBeacon（专为「页面即将卸载」场景设计），不支持时再退回 XHR。
 * iOS 走 itms-services 交给系统，页面不卸载，两种方式都可以。
 */
function trackDownload(platform) {
    var KEY  = "MTJfMF8xNzkwODU4MTI1X2ZlYmEyOTZk";
    var body = 'key=' + encodeURIComponent(KEY) + '&platform=' + encodeURIComponent(platform || '');
    try {
        if (navigator.sendBeacon) {
            // Blob 必须声明 urlencoded，PHP 端才能正常解析出 $_POST
            var blob = new Blob([body], { type: 'application/x-www-form-urlencoded' });
            if (navigator.sendBeacon('/d/download', blob)) return;
        }
    } catch(e){}
    try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/d/download', true);
        xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
        xhr.send(body);
    } catch(e){}
}
</script>
