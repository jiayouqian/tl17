/* 双滚动区：图片统一重制 4:3（内容零裁切，宽图自身虚化铺底），框按图比例等大，视觉最大化 */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0;align-content:space-evenly}
@media(max-width:900px){.dual{grid-template-columns:1fr;gap:8px}}
.zc{position:relative;background:#171209;border-radius:12px;overflow:hidden;min-width:0;min-height:0;display:flex;flex-direction:column}
.zc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px 0}
.zc-hd b{font-family:"Noto Serif SC",serif;font-size:15px;color:#e8cf9a;font-weight:900}
.zc-hd em{font-style:normal;font-size:11px;color:#8a7a5e;white-space:nowrap}
.enter{font-size:12px;color:#b6a584;text-decoration:none;border:1px solid #33271a;border-radius:999px;padding:2px 10px;flex:none;transition:.2s}
.enter:hover{color:#c9a45c;border-color:#c9a45c}
.carousel{position:relative;width:100%;margin-top:6px;overflow:hidden;aspect-ratio:3/2;flex:none;background:#171209}
@media(min-width:901px){.dual{flex:none}}
.slide{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .7s ease;pointer-events:none;overflow:hidden;background:#171209}
.slide.on{opacity:1;pointer-events:auto}
.slide img{display:block;width:100%;height:100%;object-fit:contain;object-position:center}
/* 底部文字压层已移除：宣传图自带文案，磨砂遮罩反而遮挡画面 */
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;border:none;background:rgba(255,255,255,.45);padding:0;margin:0 2px;cursor:pointer;transition:.25s;box-shadow:0 0 4px rgba(0,0,0,.6)}
.dot.on{background:rgba(255,255,255,.9)}
.zc.ml .dot.on{background:rgba(255,255,255,.9)}
.foot{text-align:center;color:#8a7a5e;font-size:11px;margin:10px 0 6px;flex:none}
