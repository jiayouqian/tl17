.enter:hover{color:#d4a94a;border-color:#d4a94a}
.carousel{position:relative;width:100%;margin-top:6px;transition:height .5s ease}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none;overflow:hidden}
.slide.on{opacity:1;pointer-events:auto}
.slide img{display:block;width:100%;height:210px;object-fit:cover;object-position:center}

.cw-mask{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,10,6,.05) 0%,rgba(13,10,6,.25) 40%,rgba(13,10,6,.88) 100%)}
.cw-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
.cw-inner img{width:min(30%,110px);border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.55);border:2px solid rgba(232,182,76,.5)}
.cw-inner b{font-family:"Noto Serif SC",serif;font-size:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.8);letter-spacing:2px}
.cw-inner .l1{font-size:14px;color:#f5d78a;font-weight:800;text-shadow:0 1px 6px rgba(0,0,0,.8)}

/* 文字叠加帧(魔幻版) */
.sl-cap{position:absolute;left:0;right:0;bottom:0;padding:20px 14px 24px;background:linear-gradient(180deg,transparent 0%,rgba(8,5,2,.88) 72%)}
.sl-badge{display:inline-block;font-size:10px;color:#191209;background:#d4a94a;border-radius:4px;padding:1px 8px;font-weight:700;margin-bottom:5px}
.sl-badge.m{background:#d34b3a;color:#fff}

.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px}
.dot{width:20px;height:5px;border-radius:3px;border:none;background:rgba(242,231,207,.4);cursor:pointer;transition:.25s}
.dot.on{background:#d4a94a}
.zc.ml .dot.on{background:#d34b3a}
.foot{text-align:center;color:#8a7a5e;font-size:11px;margin-top:20px}

<script>
(function(){
  function initCarousel(root){
    var slides = Array.prototype.slice.call(root.querySelectorAll('.slide'));
    var dots = Array.prototype.slice.call(root.querySelectorAll('.dot'));
    var i = 0, timer = null;
    function fitH(){ root.style.height='210px'; }
    function go(n){
      slides[i].classList.remove('on'); dots[i].classList.remove('on');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('on'); dots[i].classList.add('on');
      fitH();
    }
    function next(){ go(i + 1); }
    function start(){ clearInterval(timer); timer = setInterval(next, 3500); }
    slides.forEach(function(s, idx){
      var im = s.querySelector('img');
      if(im){ im.onload = function(){ if(idx === i) fitH(); }; }
    });
    dots.forEach(function(dot){
      dot.addEventListener('click', function(){
        go(parseInt(this.dataset.i, 10)); start();
      });
    });
    root.addEventListener('click', function(e){
      if(e.target.closest('.dot')) return;
      window.location.href = root.dataset.href;
    });
    root.addEventListener('mouseenter', function(){ clearInterval(timer); });
    root.addEventListener('mouseleave', start);
    window.addEventListener('resize', fitH);
    fitH();
    start();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.carousel'), initCarousel);
})();
</script>
