<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0a06;color:#f2e7cf;font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:0 14px 44px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 0 8px;border-bottom:1px solid #33271a;margin-bottom:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:"Noto Serif SC",serif;font-weight:900;font-size:20px;color:#d4a94a}
.logo svg{width:26px;height:26px}
.logo small{display:block;font-size:10px;font-weight:400;color:#8a7a5e;letter-spacing:3px}
.back{font-size:12px;color:#b6a584;text-decoration:none;border:1px solid #33271a;border-radius:999px;padding:3px 10px;flex:none}
.back:hover{color:#d4a94a;border-color:#d4a94a}
/* 双滚动区 */
.dual{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.dual{grid-template-columns:1fr;gap:14px}}
.zc{position:relative;background:#171209;border-radius:14px;overflow:hidden;min-width:0}
.zc-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px 0}
.zc-hd b{font-family:"Noto Serif SC",serif;font-size:16px;color:#e8c878;font-weight:900}
.zc-hd em{font-style:normal;font-size:11px;color:#8a7a5e;white-space:nowrap}
.enter{font-size:12px;color:#b6a584;text-decoration:none;border:1px solid #33271a;border-radius:999px;padding:3px 10px;flex:none;transition:.2s}
.enter:hover{color:#d4a94a;border-color:#d4a94a}
.carousel{position:relative;width:100%;margin-top:6px;transition:height .5s ease}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .7s ease;pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide img{display:block;width:100%;height:auto;object-fit:cover}
/* 畅玩版合成帧(无横幅素材,用图标+渐变+文字) */
.cw{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:34px 16px 44px;text-align:center;background:radial-gradient(120% 150% at 30% 0%,#2a2013 0%,#171209 62%)}
.cw img{width:min(38%,140px);border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.cw b{font-family:"Noto Serif SC",serif;font-size:19px;color:#e8c878}
.cw p{font-size:12px;color:#b6a584;line-height:1.7}
.cw .l1{font-size:14px;color:#f2e7cf;font-weight:700}
.sl-cap{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 28px;background:linear-gradient(180deg,transparent 0%,rgba(8,5,2,.86) 70%)}
.sl-badge{display:inline-block;font-size:10px;color:#191209;background:#d4a94a;border-radius:4px;padding:1px 8px;font-weight:700;margin-bottom:5px}
.sl-badge.m{background:#d34b3a;color:#fff}
.sl-cap b{display:block;font-size:16px;font-weight:800;color:#f2e7cf;text-shadow:0 1px 4px rgba(0,0,0,.55)}
.sl-cap p{font-size:12px;color:#c9b890;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{position:absolute;left:0;right:0;bottom:9px;display:flex;justify-content:center;gap:6px}
.dot{width:18px;height:4px;border-radius:2px;border:none;background:rgba(242,231,207,.35);cursor:pointer;transition:.25s}
.dot.on{background:#d4a94a}
.zc.ml .dot.on{background:#d34b3a}
.foot{text-align:center;color:#8a7a5e;font-size:11px;margin-top:24px}
</style>
</head>
<body>
<div class="wrap">

    <a class="back" href="index.html">‹ 返回门户</a>
  </header>

  <div class="dual">
    <!-- 畅玩版滚动区 -->
    <div class="zc cw-zc">
      <div class="zc-hd"><b>畅玩版</b><em>经典天龙八部</em></div>
      <a class="enter" href="tl-changwan.html">进入畅玩版 ›</a>
      <div class="carousel" data-href="tl-changwan.html">
        <div class="slide on cw"><img src="assets/tl-cw-icon.png" alt="天龙八部手机版"><b>天龙八部手机版</b><p class="l1">经典畅玩 · 最早版本 · 重温天龙</p><p>版本 1.0.1 · 大小 2.60GB</p></div>
        <div class="slide cw"><img src="assets/tl-cw-icon.png" alt="天龙八部手机版"><b>原味江湖</b><p class="l1">安卓 + 苹果双端畅玩</p><p>下载安装即开 · 经典天龙八部</p></div>

<script>
(function(){
  function initCarousel(root){
    var slides = Array.prototype.slice.call(root.querySelectorAll('.slide'));
    var dots = Array.prototype.slice.call(root.querySelectorAll('.dot'));
    var i = 0, timer = null;
    function fitH(){
      var cur = slides[i];
      var img = cur.querySelector('img');
      var h = img && img.getBoundingClientRect().height ? img.getBoundingClientRect().height : cur.offsetHeight;
      root.style.height = h + 'px';
    }
    function go(n){
      slides[i].classList.remove('on'); dots[i].classList.remove('on');
      i = (n + slides.length) % slides.length;
      slides[i].classList.add('on'); dots[i].classList.add('on');
      fitH();
    }
    function next(){ go(i + 1); }
    function start(){ clearInterval(timer); timer = setInterval(next, 3500); }
    slides.forEach(function(s, idx){
      var im = s.querySelector('img');
      if(im){ im.onload = function(){ if(idx === i) fitH(); }; }
    });
    dots.forEach(function(dot){
      dot.addEventListener('click', function(){
        go(parseInt(this.dataset.i, 10)); start();
      });
    });
    root.addEventListener('click', function(e){
      if(e.target.closest('.dot')) return;
      window.location.href = root.dataset.href;
    });
    root.addEventListener('mouseenter', function(){ clearInterval(timer); });
    root.addEventListener('mouseleave', start);
    window.addEventListener('resize', fitH);
    fitH();
    start();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.carousel'), initCarousel);
})();
</script>
