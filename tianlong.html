<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔幻天龙17职业国际服</title>
<style>html,body{margin:0;background:#120e08;min-height:100vh}#ld{color:#c9a961;text-align:center;padding:60px 20px;font-family:system-ui,sans-serif;font-size:14px;letter-spacing:2px}</style>
</head>
<body>
<div id="ld">魔幻天龙 · 加载中…</div>
<script src="index_d1.js"></script>
<script src="index_d2.js"></script>
<script src="index_d3.js"></script>
<script>
(function(){
  if(typeof B64A === 'undefined' || typeof B64B === 'undefined' || typeof B64C === 'undefined'){ fail('数据加载失败'); return; }
  var B64 = B64A + B64B + B64C;
  try{
    var bin = atob(B64);
    var u8 = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++){ u8[i]=bin.charCodeAt(i); }
    var ds = new DecompressionStream('gzip');
    var stream = new Blob([u8]).stream().pipeThrough(ds);
    new Response(stream).text().then(function(txt){
      document.open();
      document.write(txt);
      document.close();
    }).catch(fail);
  }catch(e){ fail(e); }
  function fail(e){
    document.getElementById('ld').textContent='加载失败，请刷新重试';
    console.error(e);
  }
})();
</script>
</body>
</html>
